<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Attestation CAF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .loader { border-top-color: #3B82F6; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .inp { width: 100%; margin-top: 0.25rem; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; outline: none; background: #fff; }
        .inp:focus { box-shadow: 0 0 0 2px #3b82f6; }
        .lbl { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; }
        .lbl-sm { display: block; font-size: 0.75rem; font-weight: 600; color: #1d4ed8; }
        .inp-sm { width: 100%; margin-top: 0.25rem; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; outline: none; background: #fff; }
        .sect { font-size: 0.7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6b7280; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-10 px-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-2xl overflow-hidden">

        <div class="bg-blue-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white">Attestation CAF 🏠</h1>
            <p class="text-blue-100 text-sm mt-1">Génération instantanée & sécurisée</p>
        </div>

        <div class="p-8 space-y-6">

            <!-- BAILLEUR -->
            <div>
                <label class="lbl mb-2 font-bold">Bailleur</label>
                <div class="grid grid-cols-1 gap-2">
                    <button type="button" onclick="selectBailleur('CAMILLE')" id="btn-CAMILLE" class="bailleur-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition focus:outline-none ring-blue-500">
                        <div class="font-bold text-gray-800">SCI Camille VDL</div>
                        <div class="text-xs text-gray-500">Villeneuve-sur-Lot · Gaillac</div>
                    </button>
                    <button type="button" onclick="selectBailleur('FRAL')" id="btn-FRAL" class="bailleur-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition">
                        <div class="font-bold text-gray-800">SCI FRAL</div>
                        <div class="text-xs text-gray-500">Carmaux · Foix</div>
                    </button>
                    <button type="button" onclick="selectBailleur('COLOC')" id="btn-COLOC" class="bailleur-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition">
                        <div class="font-bold text-gray-800">Indivision (Coloc)</div>
                        <div class="text-xs text-gray-500">Franck & Johan</div>
                    </button>
                </div>
            </div>

            <!-- LOCATAIRE -->
            <div class="space-y-4">
                <div class="sect">Locataire</div>
                <div>
                    <label class="lbl" for="nom">Nom du locataire</label>
                    <input type="text" id="nom" class="inp" placeholder="Ex: Jean Dupont">
                </div>
                <div>
                    <label class="lbl" for="nom2">2ème locataire / conjoint <span class="font-normal text-gray-400">(facultatif)</span></label>
                    <input type="text" id="nom2" class="inp" placeholder="Ex: Marie Dupont">
                </div>
                <div>
                    <label class="lbl" for="date_entree">Locataire en titre depuis le</label>
                    <input type="date" id="date_entree" class="inp">
                </div>
            </div>

            <!-- LOGEMENT -->
            <div class="space-y-4">
                <div class="sect">Logement</div>
                <div>
                    <label class="lbl" for="immeuble">Immeuble</label>
                    <select id="immeuble" class="inp" onchange="choisirImmeuble()"></select>
                </div>
                <div>
                    <label class="lbl" for="adresse_logement">Adresse du logement</label>
                    <input type="text" id="adresse_logement" class="inp" placeholder="N° et rue, code postal, ville" oninput="adresseAuto=false">
                </div>
                <div>
                    <label class="lbl" for="complement">Appartement / étage <span class="font-normal text-gray-400">(facultatif)</span></label>
                    <input type="text" id="complement" class="inp" placeholder="Ex: Appt 3, 1er étage gauche">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="lbl" for="surface">Surface réelle (m²)</label>
                        <input type="text" inputmode="decimal" id="surface" class="inp" placeholder="Ex: 27,5">
                    </div>
                    <div>
                        <label class="lbl" for="chambre">Chambre (pièce unique sans WC) ?</label>
                        <select id="chambre" class="inp">
                            <option value="non" selected>Non</option>
                            <option value="oui">Oui</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- LOYER -->
            <div class="space-y-4">
                <div class="sect">Loyer</div>
                <div>
                    <label class="lbl" for="mois">Mois concerné</label>
                    <input type="text" id="mois" class="inp" placeholder="Ex: Décembre 2025">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="lbl" for="loyer">Loyer HC (€)</label>
                        <input type="number" step="0.01" min="0" inputmode="decimal" id="loyer" class="inp" placeholder="450">
                    </div>
                    <div>
                        <label class="lbl" for="charges">Charges (€)</label>
                        <input type="number" step="0.01" min="0" inputmode="decimal" id="charges" class="inp" placeholder="30">
                    </div>
                </div>
                <div>
                    <label class="lbl" for="loyer_meuble_cc">Si meublé : loyer charges comprises (€) <span class="font-normal text-gray-400">(facultatif)</span></label>
                    <input type="number" step="0.01" min="0" inputmode="decimal" id="loyer_meuble_cc" class="inp">
                </div>

                <div id="coloc-fields" class="hidden bg-blue-50 p-4 rounded-lg space-y-3 border border-blue-100">
                    <h3 class="text-sm font-bold text-blue-800">Options Colocation</h3>
                    <div>
                        <label class="lbl-sm" for="nb_coloc">Nombre de colocataires (y compris le demandeur)</label>
                        <input type="number" step="1" min="2" id="nb_coloc" class="inp-sm" placeholder="Ex: 3">
                    </div>
                    <div>
                        <label class="lbl-sm" for="loyer_total">Loyer TOTAL Coloc (€)</label>
                        <input type="number" step="0.01" min="0" id="loyer_total" class="inp-sm">
                    </div>
                </div>

                <details class="border border-gray-200 rounded-lg p-3">
                    <summary class="cursor-pointer text-sm font-semibold text-gray-700">Loyer de juillet <span class="font-normal text-gray-400">(facultatif)</span></summary>
                    <div class="mt-3 space-y-3">
                        <div>
                            <label class="lbl-sm" for="j_annee">Année de juillet</label>
                            <input type="text" inputmode="numeric" id="j_annee" class="inp-sm" placeholder="Ex: 2025">
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="lbl-sm" for="j_loyer">Loyer HC</label>
                                <input type="number" step="0.01" min="0" id="j_loyer" class="inp-sm">
                            </div>
                            <div>
                                <label class="lbl-sm" for="j_charges">Charges</label>
                                <input type="number" step="0.01" min="0" id="j_charges" class="inp-sm">
                            </div>
                            <div>
                                <label class="lbl-sm" for="j_meuble">Meublé CC</label>
                                <input type="number" step="0.01" min="0" id="j_meuble" class="inp-sm">
                            </div>
                        </div>
                    </div>
                </details>
            </div>

            <button type="button" onclick="genererPDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transform transition hover:scale-[1.02] flex justify-center items-center">
                <span id="btn-text">Télécharger l'Attestation PDF</span>
                <div id="loader" class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-6 w-6 ml-2 hidden"></div>
            </button>

        </div>

        <div class="bg-gray-50 p-4 text-center text-xs text-gray-400">
            Propulsé par CortoXYZ
        </div>
    </div>

    <script>
        // ============================================================
        // PARTIE PURE : remplissage du PDF (aucune dépendance au DOM)
        // Les coordonnées sont en mm depuis le coin bas-gauche de la page A4.
        // ============================================================
        // <PURE>
        const MM = 2.83465; // 1 mm = 2.83465 points PDF

        function fmtDateFR(iso) {            // "2025-12-01" -> "01/12/2025" (sans fuseau horaire)
            const p = String(iso).split('-');
            return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(iso);
        }
        function fmtNombre(n) {              // 27.5 -> "27,5" ; 89.35 -> "89,35" ; vide -> ""
            if (n === null || n === undefined || n === '') return '';
            const x = Number(n);
            if (!isFinite(x)) return '';
            return String(Math.round(x * 100) / 100).replace('.', ',');
        }
        function fmtMontant(n) {             // montants : 2 décimales seulement si nécessaire ; vide -> "" (jamais "0")
            if (n === null || n === undefined || n === '') return '';
            const x = Number(n);
            if (!isFinite(x)) return '';
            return Number.isInteger(x) ? String(x) : x.toFixed(2).replace('.', ',');
        }

        async function remplirAttestation(PDFLib, templateBytes, b, d, dateJour) {
            const { PDFDocument, StandardFonts, rgb } = PDFLib;
            const pdfDoc = await PDFDocument.load(templateBytes);
            const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
            const page = pdfDoc.getPages()[0];

            // Garde uniquement les caractères supportés par la police standard (WinAnsi)
            const clean = s => String(s).replace(/[^\x20-\x7E -ÿ€’‘“”–—…]/g, '');

            // o.maxW (mm) : réduit la taille pour tenir dans la largeur ; o.right : aligne à droite sur x
            const draw = (text, x_mm, y_mm, o = {}) => {
                if (text === undefined || text === null || text === '') return;
                const t = clean(text);
                if (!t) return;
                let size = o.size || 10;
                if (o.maxW) {
                    while (size > (o.minSize || 6) && font.widthOfTextAtSize(t, size) > o.maxW * MM) size -= 0.25;
                }
                let x = x_mm * MM;
                if (o.right) x -= font.widthOfTextAtSize(t, size);
                page.drawText(t, { x, y: y_mm * MM, size, font, color: rgb(0, 0, 0) });
            };

            // --- Bailleur ---
            draw(b.nom, 125, 252, { maxW: 75 });
            draw(b.adresse, 35, 248, { maxW: 160 });
            draw(b.tel, 38, 243);
            draw(b.email, 110, 239, { maxW: 85 });
            draw(b.siret, 32, 234);

            // --- Locataire(s) ---
            draw(d.nom, 80, 230, { maxW: 37, minSize: 5 });
            draw(d.nom2, 160.5, 230, { maxW: 37, minSize: 5 });
            draw(fmtDateFR(d.dateEntree), 67, 225);

            // --- Logement : adresse complète + surface ---
            const adresseComplete = [d.complement, d.adresseLogement].filter(Boolean).join(', ');
            draw(adresseComplete, 15, 220, { maxW: 185 });

            draw('X', d.chambre === 'oui' ? 87.4 : 100, 216);          // Chambre (pièce unique sans WC) oui / non
            draw(fmtNombre(d.surface), 96.5, 211.4, { right: true });  // Surface (alignée à droite, juste avant "m2")

            // --- Colocation ---
            if (b.coloc) {
                draw('X', 82, 207);                                    // Coloc OUI
                draw(d.nbColoc ? String(d.nbColoc) : '', 188.8, 207);  // Nombre de colocataires (dans la case)
            } else {
                draw('X', 95, 207);                                    // Coloc NON
            }

            // --- Loyer du mois d'entrée / mois concerné ---
            draw(d.mois, 90, 198, { maxW: 38 });
            draw(fmtMontant(d.loyer), 50, 193, { maxW: 20 });
            draw(fmtMontant(d.charges), 107, 193, { maxW: 11 });
            draw(fmtMontant(d.meubleCC), 180, 193, { maxW: 17 });
            if (b.coloc) draw(fmtMontant(d.loyerTotal), 82, 188, { maxW: 38 });

            // --- Loyer de juillet (facultatif) ---
            draw(d.jAnnee, 71, 183.5);
            draw(fmtMontant(d.jLoyer), 50, 179, { maxW: 20 });
            draw(fmtMontant(d.jCharges), 107, 179, { maxW: 11 });
            draw(fmtMontant(d.jMeuble), 180, 179, { maxW: 17 });

            // --- Cases fixes ---
            draw('X', 125, 175); // Locataire à jour : OUI
            draw('X', 70, 165);  // Sous-location : NON
            draw('X', 96, 156);  // Hôtel / pension de famille : NON
            draw('X', 33, 111);  // Versement direct : NON
            draw('X', 127, 106); // Logement décent : OUI

            // --- Signature ---
            draw('Toulouse', 20, 65);
            draw(dateJour, 75, 65);

            return await pdfDoc.save();
        }
        // </PURE>

        // ============================================================
        // CONFIGURATION (tes données sont ici)
        // ============================================================
        const BAILLEURS = {
            'CAMILLE': {
                nom: "SCI Camille VDL", adresse: "8 A rue Labat de Savignac, 31500 Toulouse",
                email: "franck.sainmont@gmail.com", siret: "891 854 473 00024", tel: "06 89 94 14 92",
                coloc: false, code: "CAMILLE",
                immeubles: [
                    "26 boulevard Camille Desmoulins, 47300 Villeneuve-sur-Lot",
                    "69 rue de la Madeleine, 81600 Gaillac"
                ]
            },
            'FRAL': {
                nom: "SCI FRAL", adresse: "8 A rue Labat de Savignac, 31500 Toulouse",
                email: "francksainmont@gmail.com", siret: "941 471 088 00018", tel: "06 89 94 14 92",
                coloc: false, code: "FRAL",
                immeubles: [
                    "36 avenue Bouloc Torcatis, 81400 Carmaux",
                    "20 rue du Four d'Amont, 09000 Foix"
                ]
            },
            'COLOC': {
                nom: "Indivision Franck et Johan Sainmont", adresse: "8 Rue Labat de Savignac, 31500 Toulouse",
                email: "appartmusset@gmail.com", siret: "884 685 363 00019", tel: "06 89 94 14 92",
                coloc: true, code: "COLOC",
                immeubles: []
            }
        };

        let currentBailleur = null;
        let adresseAuto = true; // true tant que l'adresse a été remplie par la liste d'immeubles (et pas tapée à la main)

        // Mois par défaut : mois en cours
        const today = new Date();
        document.getElementById('mois').value = today.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });

        function remplirListeImmeubles() {
            const sel = document.getElementById('immeuble');
            sel.innerHTML = '';
            const o0 = document.createElement('option');
            o0.value = ''; o0.textContent = '— Choisir un immeuble —';
            sel.appendChild(o0);
            currentBailleur.immeubles.forEach(a => {
                const o = document.createElement('option');
                o.value = a; o.textContent = a;
                sel.appendChild(o);
            });
            const oAutre = document.createElement('option');
            oAutre.value = '__autre__'; oAutre.textContent = 'Autre adresse (saisie libre)';
            sel.appendChild(oAutre);
        }

        function choisirImmeuble() {
            const v = document.getElementById('immeuble').value;
            const champ = document.getElementById('adresse_logement');
            if (v && v !== '__autre__') {
                champ.value = v;
                adresseAuto = true;
            } else if (v === '__autre__') {
                champ.value = '';
                adresseAuto = false;
                champ.focus();
            }
        }

        function selectBailleur(code) {
            currentBailleur = BAILLEURS[code];

            // Gestion visuelle des boutons
            document.querySelectorAll('.bailleur-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'bg-blue-50', 'ring-2');
                btn.classList.add('border-gray-200');
            });
            const activeBtn = document.getElementById('btn-' + code);
            activeBtn.classList.remove('border-gray-200');
            activeBtn.classList.add('border-blue-600', 'bg-blue-50', 'ring-2');

            // Afficher/Masquer champs coloc
            document.getElementById('coloc-fields').classList.toggle('hidden', !currentBailleur.coloc);

            // Liste d'immeubles du bailleur ; on vide l'adresse seulement si elle venait de la liste
            remplirListeImmeubles();
            if (adresseAuto) document.getElementById('adresse_logement').value = '';
        }

        // Sélection par défaut
        selectBailleur('CAMILLE');

        function resetBouton() {
            document.getElementById('btn-text').innerText = "Télécharger l'Attestation PDF";
            document.getElementById('loader').classList.add('hidden');
        }

        async function genererPDF() {
            const val = id => document.getElementById(id).value.trim();
            const num = id => { const s = val(id).replace(',', '.'); return s === '' ? null : parseFloat(s); };

            const d = {
                nom: val('nom'),
                nom2: val('nom2'),
                dateEntree: val('date_entree'),
                adresseLogement: val('adresse_logement'),
                complement: val('complement'),
                surface: num('surface'),
                chambre: val('chambre'),
                mois: val('mois'),
                loyer: num('loyer'),
                charges: num('charges'),
                meubleCC: num('loyer_meuble_cc'),
                nbColoc: val('nb_coloc'),
                loyerTotal: num('loyer_total'),
                jAnnee: val('j_annee'),
                jLoyer: num('j_loyer'),
                jCharges: num('j_charges'),
                jMeuble: num('j_meuble')
            };

            // Champs obligatoires (pour ne plus jamais générer une attestation avec adresse / surface vides)
            const manquants = [];
            if (!d.nom) manquants.push("le nom du locataire");
            if (!d.dateEntree) manquants.push("la date d'entrée");
            if (!d.adresseLogement) manquants.push("l'adresse du logement");
            if (d.surface === null || isNaN(d.surface) || d.surface <= 0 || d.surface > 1000) manquants.push("la surface (en m²)");
            if (d.loyer === null || isNaN(d.loyer)) manquants.push("le loyer HC");
            if (currentBailleur.coloc && !d.nbColoc) manquants.push("le nombre de colocataires");
            if (manquants.length) {
                alert("Merci de renseigner : " + manquants.join(", ") + ".");
                return;
            }

            // Animation chargement
            document.getElementById('btn-text').innerText = "Génération...";
            document.getElementById('loader').classList.remove('hidden');

            try {
                // Charger le modèle PDF (attestation.pdf doit être à côté de index.html)
                const res = await fetch('attestation.pdf');
                if (!res.ok) throw new Error("Impossible de charger 'attestation.pdf' (HTTP " + res.status + "). Vérifie qu'il est bien à côté de index.html.");
                const templateBytes = await res.arrayBuffer();

                const dateJour = new Date().toLocaleDateString('fr-FR');
                const pdfBytes = await remplirAttestation(PDFLib, templateBytes, currentBailleur, d, dateJour);

                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Attestation_${currentBailleur.code}_${d.nom.replace(/\s+/g, '_')}.pdf`;
                link.click();
                setTimeout(() => URL.revokeObjectURL(link.href), 10000);

            } catch (err) {
                console.error(err);
                alert("Erreur : " + (err && err.message ? err.message : err));
            }

            resetBouton();
        }
    </script>
</body>
</html>
