<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Attestation CAF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .loader { border-top-color: #3B82F6; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-10 px-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-2xl overflow-hidden">
        
        <div class="bg-blue-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white">Attestation CAF 🏠</h1>
            <p class="text-blue-100 text-sm mt-1">Génération instantanée & sécurisée</p>
        </div>

        <div class="p-8 space-y-6">
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Bailleur</label>
                <div class="grid grid-cols-1 gap-2">
                    <button onclick="selectBailleur('CAMILLE')" id="btn-CAMILLE" class="bailleur-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition focus:outline-none ring-blue-500">
                        <div class="font-bold text-gray-800">SCI Camille VDL</div>
                        <div class="text-xs text-gray-500">Camille Soula</div>
                    </button>
                    <button onclick="selectBailleur('FRAL')" id="btn-FRAL" class="bailleur-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition">
                        <div class="font-bold text-gray-800">SCI FRAL</div>
                        <div class="text-xs text-gray-500">Labat de Savignac</div>
                    </button>
                    <button onclick="selectBailleur('COLOC')" id="btn-COLOC" class="bailleur-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition">
                        <div class="font-bold text-gray-800">Indivision (Coloc)</div>
                        <div class="text-xs text-gray-500">Franck & Johan</div>
                    </button>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Nom du locataire</label>
                    <input type="text" id="nom" class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: Jean Dupont">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Entrée le</label>
                        <input type="date" id="date_entree" class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Loyer HC (€)</label>
                        <input type="number" id="loyer" class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="450">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">Mois concerné</label>
                    <input type="text" id="mois" class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: Décembre 2025">
                </div>

                <div id="coloc-fields" class="hidden bg-blue-50 p-4 rounded-lg space-y-3 border border-blue-100">
                    <h3 class="text-sm font-bold text-blue-800">Options Colocation</h3>
                    <div>
                        <label class="block text-xs font-semibold text-blue-700">Loyer TOTAL Coloc</label>
                        <input type="number" id="loyer_total" class="w-full mt-1 p-2 border rounded focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-blue-700">Loyer Meublé CC</label>
                        <input type="number" id="loyer_meuble_cc" class="w-full mt-1 p-2 border rounded focus:ring-blue-500 outline-none">
                    </div>
                </div>
            </div>

            <button onclick="genererPDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transform transition hover:scale-[1.02] flex justify-center items-center">
                <span id="btn-text">Télécharger l'Attestation PDF</span>
                <div id="loader" class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-6 w-6 ml-2 hidden"></div>
            </button>

        </div>
        
        <div class="bg-gray-50 p-4 text-center text-xs text-gray-400">
            Propulsé par CortoXYZ
        </div>
    </div>

    <script>
        // CONFIGURATION (Tes données sont ici)
        const BAILLEURS = {
            'CAMILLE': { nom: "SCI Camille VDL", adresse: "8 Rue Labat de Savignac, 31500 Toulouse", email: "franck.sainmont@gmail.com", siret: "891 854 473 00024", coloc: false, code: "CAMILLE" },
            'FRAL': { nom: "SCI FRAL", adresse: "8 Rue Labat de Savignac, 31500 Toulouse", email: "francksainmont@gmail.com", siret: "941 471 088 00018", coloc: false, code: "FRAL" },
            'COLOC': { nom: "Indivision Franck et Johan Sainmont", adresse: "8 Rue Labat de Savignac, 31500 Toulouse", email: "appartmusset@gmail.com", siret: "884 685 363 00019", coloc: true, code: "COLOC" }
        };

        let currentBailleur = null;

        // Initialisation : Date du jour
        const today = new Date();
        document.getElementById('mois').value = today.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });
        
        function selectBailleur(code) {
            currentBailleur = BAILLEURS[code];
            
            // Gestion visuelle des boutons
            document.querySelectorAll('.bailleur-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'bg-blue-50', 'ring-2');
                btn.classList.add('border-gray-200');
            });
            const activeBtn = document.getElementById('btn-' + code);
            activeBtn.classList.remove('border-gray-200');
            activeBtn.classList.add('border-blue-600', 'bg-blue-50', 'ring-2');

            // Afficher/Masquer champs coloc
            const colocDiv = document.getElementById('coloc-fields');
            if (currentBailleur.coloc) {
                colocDiv.classList.remove('hidden');
            } else {
                colocDiv.classList.add('hidden');
            }
        }

        // Sélection par défaut
        selectBailleur('CAMILLE');

        async function genererPDF() {
            const nom = document.getElementById('nom').value;
            const dateEntreeInput = document.getElementById('date_entree').value;
            const loyer = document.getElementById('loyer').value;
            const mois = document.getElementById('mois').value;

            if (!nom || !loyer || !dateEntreeInput) {
                alert("Merci de remplir le nom, la date d'entrée et le loyer !");
                return;
            }

            // Animation chargement
            document.getElementById('btn-text').innerText = "Génération...";
            document.getElementById('loader').classList.remove('hidden');

            try {
                // 1. Charger le modèle PDF (Il doit être à côté de l'index.html ou accessible en ligne)
                // Pour l'exemple, assure-toi que 'attestation.pdf' est dans le même dossier sur GitHub
                const url = 'attestation.pdf'; 
                const existingPdfBytes = await fetch(url).then(res => res.arrayBuffer());

                // 2. Créer le document
                const { PDFDocument, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.load(existingPdfBytes);
                const page = pdfDoc.getPages()[0];
                const { width, height } = page.getSize();
                
                // Fonction utilitaire pour écrire (conversion mm -> points PDF)
                // 1 mm = 2.83465 points
                const draw = (text, x_mm, y_mm) => {
                    if(!text) return;
                    page.drawText(String(text), {
                        x: x_mm * 2.83465,
                        y: y_mm * 2.83465,
                        size: 10,
                        color: rgb(0, 0, 0),
                    });
                };

                // Formatage dates
                const dateEntree = new Date(dateEntreeInput).toLocaleDateString('fr-FR');
                const dateJour = new Date().toLocaleDateString('fr-FR');

                // --- REMPLISSAGE (Coordonnées reprises de ton script Python) ---
                
                // Bailleur
                draw(currentBailleur.nom, 125, 252);
                draw(currentBailleur.adresse, 35, 248);
                draw("06 89 94 14 92", 38, 243);
                draw(currentBailleur.email, 110, 239);
                draw(currentBailleur.siret, 32, 234);

                // Locataire
                draw(nom, 80, 230);
                draw(dateEntree, 67, 225);

                // Logement
                draw("8 Rue Labat de Savignac, 31500 Toulouse", 15, 220);
                draw("X", 100, 216); // Pièce unique NON
                draw("20", 90, 212); // Surface

                // Loyer
                draw(mois, 90, 198);
                draw(loyer, 50, 193);
                
                // Cases fixes
                draw("X", 125, 175);
                draw("X", 70, 165);
                draw("X", 96, 156);
                draw("X", 33, 111);
                draw("X", 127, 106);

                // Coloc logic
                if (currentBailleur.coloc) {
                    draw("X", 82, 207); // Coloc OUI
                    const l_tot = document.getElementById('loyer_total').value;
                    const l_meub = document.getElementById('loyer_meuble_cc').value;
                    draw(l_tot, 90, 188);
                    draw(l_meub, 180, 193);
                } else {
                    draw("X", 95, 207); // Coloc NON
                }

                // Signature
                draw("Toulouse", 20, 65);
                draw(dateJour, 75, 65);

                // 3. Sauvegarder et Télécharger
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Attestation_${currentBailleur.code}_${nom.replace(/\s+/g, '_')}.pdf`;
                link.click();

            } catch (err) {
                console.error(err);
                alert("Erreur : Impossible de charger 'attestation.pdf'. Vérifie qu'il est bien dans le dossier.");
            }

            document.getElementById('btn-text').innerText = "Télécharger l'Attestation PDF";
            document.getElementById('loader').classList.add('hidden');
        }
    </script>
</body>
</html>
